<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>همس الروايات</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

    :root {
      --bg-dark: #050A1F;
      --card-bg: #0B132B;
      --neon-blue: #00F5D4;
      --neon-purple: #7B2CBF;
      --text-light: #E0E1DD;
      --text-dim: #8D99AE;
      --font-size-base: 1rem;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* هيدر وشريط علوي */
    header {
      background: rgba(11, 19, 43, 0.9);
      backdrop-filter: blur(10px);
      padding: 15px 20px;
      position: sticky; top: 0; z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid var(--neon-purple);
    }

    .logo { color: var(--neon-blue); font-size: 1.5rem; font-weight: 900; }

    .header-btns { display: flex; gap: 10px; align-items: center; }

    .btn-whatsapp {
      background: #25D366; color: #fff;
      padding: 8px 14px; border-radius: 20px;
      text-decoration: none; font-weight: bold; font-size: 0.85rem;
      display: flex; align-items: center; gap: 6px;
      box-shadow: 0 0 10px rgba(37, 211, 102, 0.4);
    }

    /* المحتوى الرئيسي */
    container { display: block; max-width: 800px; margin: 20px auto; padding: 0 15px; }

    .search-box {
      width: 100%; padding: 12px; border-radius: 10px;
      border: 1px solid var(--neon-purple); background: var(--card-bg);
      color: #fff; margin-bottom: 20px; font-size: 1rem; outline: none;
    }

    .cards-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px;
    }

    .card {
      background: var(--card-bg); border-radius: 12px; padding: 15px;
      border: 1px solid rgba(255,255,255,0.05); text-align: center;
      transition: 0.3s;
    }

    .card:hover { transform: translateY(-5px); border-color: var(--neon-blue); }

    /* الصورة الدائرية للكاتب والقصة */
    .avatar-circle {
      width: 90px; height: 90px;
      border-radius: 50%;
      border: 2px solid var(--neon-blue);
      object-fit: cover;
      margin: 0 auto 10px auto;
      display: block;
      box-shadow: 0 0 10px var(--neon-blue);
    }

    .btn-neon {
      background: transparent; border: 1px solid var(--neon-blue);
      color: var(--neon-blue); padding: 8px 16px; border-radius: 6px;
      cursor: pointer; margin-top: 10px; transition: 0.3s; font-weight: bold;
    }

    .btn-neon:hover { background: var(--neon-blue); color: var(--bg-dark); }

    /* شاشة القراءة */
    #view-story-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-dark); z-index: 2000; overflow-y: auto; padding: 20px 15px;
    }

    .story-content {
      max-width: 700px; margin: 0 auto;
      font-size: var(--font-size-base); line-height: 1.9; white-space: pre-line;
    }

    #reading-progress {
      position: fixed; top: 0; right: 0; height: 4px; background: var(--neon-blue); width: 0%; z-index: 3000;
    }

    /* شريط أدوات القارئ */
    .reader-tools {
      display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap;
    }

    .tool-btn {
      background: var(--card-bg); border: 1px solid var(--neon-purple);
      color: var(--text-light); padding: 8px 12px; border-radius: 8px; cursor: pointer;
    }

    /* تنسيقات التعليقات */
    .comment-box {
      background: var(--card-bg); padding: 10px; border-radius: 8px; margin-top: 10px;
      border-right: 3px solid var(--neon-purple);
    }

    /* --- تنسيق الطباعة وتنزيل ה-PDF لتكون الخلفية بيضاء والنص أسود صريح --- */
    @media print {
      body * { visibility: hidden; }
      #view-story-modal, #view-story-modal * { visibility: visible; }
      #view-story-modal {
        position: absolute; left: 0; top: 0; width: 100%;
        background: #ffffff !important; color: #000000 !important;
        padding: 0 !important;
      }
      .reader-tools, #reading-progress, .btn-whatsapp, header, button { display: none !important; }
      .story-content {
        color: #000000 !important; font-size: 14pt !important;
        line-height: 1.6 !important; background: #ffffff !important;
      }
    }
  </style>
</head>
<body>

  <div id="reading-progress"></div>

  <header>
    <div class="logo" id="site-logo">همس الروايات</div>
    <div class="header-btns">
      <a href="https://whatsapp.com/channel/0029Vb7oJOpBKfhvWKl57w46" target="_blank" class="btn-whatsapp">
        <i class="fab fa-whatsapp"></i> قناة الواتساب
      </a>
    </div>
  </header>

  <container>
    <input type="text" id="search-input" class="search-box" placeholder="ابحث عن قصة، كاتب، أو تصنيف..." oninput="renderApp()">

    <h3 style="color: var(--neon-blue); margin-bottom: 12px;"><i class="fas fa-fire"></i> أحدث القصص</h3>
    <div class="cards-grid" id="stories-list"></div>

    <h3 style="color: var(--neon-blue); margin: 25px 0 12px 0;"><i class="fas fa-pen-nib"></i> الكُتاب</h3>
    <div class="cards-grid" id="authors-list"></div>
  </container>

  <!-- نافذة قراءة القصة -->
  <div id="view-story-modal">
    <div style="max-width: 700px; margin: 0 auto;">
      <button class="btn-neon" onclick="closeStory()" style="margin-bottom: 15px;"><i class="fas fa-arrow-right"></i> عودة</button>
      <h2 id="view-story-title" style="color: var(--neon-blue); text-align: center; margin-bottom: 10px;"></h2>
      
      <div class="reader-tools">
        <button class="tool-btn" onclick="changeFontSize(0.1)"><i class="fas fa-font"></i> +</button>
        <button class="tool-btn" onclick="changeFontSize(-0.1)"><i class="fas fa-font"></i> -</button>
        <button class="tool-btn" onclick="speakStory()"><i class="fas fa-volume-up"></i> استماع</button>
        <button class="tool-btn" onclick="toggleAutoScroll()"><i class="fas fa-scroll"></i> تمرير تلقائي</button>
        <button class="tool-btn" onclick="window.print()"><i class="fas fa-file-pdf"></i> تنزيل PDF</button>
      </div>

      <div class="story-content" id="view-story-body"></div>

      <!-- قسم التعليقات -->
      <div style="margin-top: 40px; border-top: 1px solid var(--neon-purple); padding-top: 20px;">
        <h3 style="color: var(--neon-blue); margin-bottom: 10px;">التعليقات</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
          <input type="text" id="comment-input" class="search-box" style="margin:0;" placeholder="اكتب تعليقك...">
          <button class="btn-neon" onclick="addComment()">إرسال</button>
        </div>
        <div id="comments-list"></div>
      </div>
    </div>
  </div>
    <script>
    let autoScrollInterval = null;
    let fontSize = 1.0;
    let currentStoryTitle = '';

    function getDB() {
      return {
        authors: JSON.parse(localStorage.getItem('app_authors') || '[]'),
        stories: JSON.parse(localStorage.getItem('app_stories') || '[]'),
        settings: JSON.parse(localStorage.getItem('app_settings') || '{"title":"همس الروايات"}'),
        comments: JSON.parse(localStorage.getItem('app_comments') || '{}')
      };
    }

    function renderApp() {
      const db = getDB();
      const search = document.getElementById('search-input').value.toLowerCase();

      // تحديث عنوان الموقع
      document.getElementById('site-logo').innerText = db.settings.title || 'همس الروايات';

      // عرض القصص
      const storiesList = document.getElementById('stories-list');
      const filteredStories = db.stories.filter(s => 
        s.title.toLowerCase().includes(search) || 
        s.author.toLowerCase().includes(search) || 
        s.category.toLowerCase().includes(search)
      );

      storiesList.innerHTML = filteredStories.length ? filteredStories.map(s => `
        <div class="card">
          <h4 style="color: var(--neon-blue); margin-bottom: 8px;">${s.title}</h4>
          <p style="color: var(--text-dim); font-size: 0.9rem;">الكاتب: ${s.author}</p>
          <p style="color: var(--neon-purple); font-size: 0.85rem; margin-top: 4px;">#${s.category}</p>
          <button class="btn-neon" onclick="openStory('${s.title}')">قراءة القصة</button>
        </div>
      `).join('') : '<p style="color:var(--text-dim);">لا توجد قصص مطابقة.</p>';

      // عرض الكُتاب مع الصورة الدائرية
      const authorsList = document.getElementById('authors-list');
      const filteredAuthors = db.authors.filter(a => a.name.toLowerCase().includes(search));

      authorsList.innerHTML = filteredAuthors.length ? filteredAuthors.map(a => `
        <div class="card">
          <img src="${a.img || 'https://via.placeholder.com/150'}" class="avatar-circle" alt="${a.name}">
          <h4>${a.name}</h4>
          <p style="color: var(--text-dim); font-size: 0.85rem; margin-top: 5px;">${a.age}</p>
          <p style="font-size: 0.8rem; margin-top: 8px; color: var(--text-light);">${a.bio}</p>
        </div>
      `).join('') : '<p style="color:var(--text-dim);">لا يوجد كُتاب مطابقون.</p>';
    }

    function openStory(title) {
      const db = getDB();
      const story = db.stories.find(s => s.title === title);
      if(!story) return;

      currentStoryTitle = title;
      document.getElementById('view-story-title').innerText = story.title;
      document.getElementById('view-story-body').innerText = story.body;
      document.getElementById('view-story-modal').style.display = 'block';
      
      renderComments();
    }

    function closeStory() {
      document.getElementById('view-story-modal').style.display = 'none';
      if(autoScrollInterval) { clearInterval(autoScrollInterval); autoScrollInterval = null; }
    }

    function changeFontSize(val) {
      fontSize += val;
      if (fontSize < 0.7) fontSize = 0.7;
      document.documentElement.style.setProperty('--font-size-base', `${fontSize}rem`);
    }

    function toggleAutoScroll() {
      if(autoScrollInterval) {
        clearInterval(autoScrollInterval);
        autoScrollInterval = null;
        alert('تم إيقاف التمرير التلقائي');
      } else {
        autoScrollInterval = setInterval(() => { window.scrollBy(0, 1); }, 40);
      }
    }

    function speakStory() {
      const text = document.getElementById('view-story-body').innerText;
      const speech = new SpeechSynthesisUtterance(text);
      speech.lang = 'ar-SA';
      window.speechSynthesis.speak(speech);
    }

    function addComment() {
      const input = document.getElementById('comment-input');
      if(!input.value.trim()) return;
      let db = getDB();
      if(!db.comments[currentStoryTitle]) db.comments[currentStoryTitle] = [];
      db.comments[currentStoryTitle].push(input.value.trim());
      localStorage.setItem('app_comments', JSON.stringify(db.comments));
      input.value = '';
      renderComments();
    }

    function renderComments() {
      const db = getDB();
      const list = db.comments[currentStoryTitle] || [];
      document.getElementById('comments-list').innerHTML = list.length ? 
        list.map(c => `<div class="comment-box">${c}</div>`).join('') : 
        '<p style="color:var(--text-dim);">لا توجد تعليقات بعد.</p>';
    }

    window.onscroll = function() {
      let winScroll = document.documentElement.scrollTop;
      let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      let scrolled = (winScroll / height) * 100;
      document.getElementById("reading-progress").style.width = scrolled + "%";
    };

    window.onload = renderApp;
  </script>
</body>
</html>
